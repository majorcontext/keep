# The demo script substitutes RULES_DIR and LOG_OUTPUT at runtime.
listen: ":18081"
rules_dir: "RULES_DIR"
provider: anthropic
upstream: "https://api.anthropic.com"
scope: vibe-check
decompose:
  text: true
  tool_result: true
  tool_use: true
judge:
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
log:
  format: json
  output: "LOG_OUTPUT"
